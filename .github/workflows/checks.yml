name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test domains, API contracts, storage and process lifecycle
        run: python -m unittest discover -s tests -v
      - name: Check architecture and publication boundaries
        run: |
          python scripts/check_architecture.py
          python scripts/check_public_docs.py
          python scripts/validate_ocr_holdout.py
          python scripts/validate_ocr_holdout.py --version v7
          python -m compileall -q contracts.py maintenance.py storage.py transport.py process_lifecycle.py service.py gateway.py runtime.py runtime_control.py services scripts
      - name: Install the pinned frontend toolchain
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Build the frontend
        run: pnpm --dir frontend build
      - name: Check acquisition rendering and sample inputs without a browser
        run: pnpm --dir frontend check:acquisition
      - name: Check snapshot confirmation rendering and handlers without a browser
        run: pnpm --dir frontend check:confirmation
      - name: Verify three-state and historical evaluation rendering
        run: node scripts/check_evaluation_render.mjs
      - name: Verify runtime readiness, cancellation and visibility polling
        run: node scripts/check_frontend_runtime.mjs
      - name: Install the pinned browser runtime
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Verify keyboard, confirmation, replay and responsive flows
        run: pnpm --dir frontend check:ui

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.10'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned build dependencies
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          python -m pip install -r requirements-build.txt
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Build the frontend
        run: pnpm --dir frontend build
      - name: Build the frozen runtime, native host and offline NSIS installer
        run: python scripts/build_desktop.py --installer
      - name: Test native integrity and loopback contracts
        run: python scripts/build_desktop.py --test-native
      - name: Verify twenty starts, each worker fault and forced host exit
        run: python scripts/check_desktop.py --cycles 20 --executable desktop/target/release/lootweave-desktop.exe
      - name: Verify twenty experimental on-demand starts and fault recovery
        run: python scripts/check_desktop.py --cycles 20 --startup-policy on-demand --executable desktop/target/release/lootweave-desktop.exe
      - name: Ensure the WebView2 runtime before checking the bare native host
        shell: pwsh
        run: |
          # Building the offline NSIS installer does not execute its runtime setup.
          # Microsoft documents these pv keys and /silent /install at:
          # https://learn.microsoft.com/microsoft-edge/webview2/concepts/distribution
          $ErrorActionPreference = 'Stop'
          function Get-WebViewRuntimeVersion {
            $runtimeKeys = @(
              'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
              'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
            )
            foreach ($runtimeKey in $runtimeKeys) {
              $runtimeVersion = Get-ItemPropertyValue -LiteralPath $runtimeKey -Name pv -ErrorAction SilentlyContinue
              if ($runtimeVersion -is [string] -and $runtimeVersion -match '^\d{1,5}(\.\d{1,5}){3}$') {
                $parsedVersion = $null
                if ([version]::TryParse($runtimeVersion, [ref]$parsedVersion) -and $parsedVersion -gt [version]'0.0.0.0') {
                  return $runtimeVersion
                }
              }
            }
            return $null
          }
          $runtimeStage = 'runtime_detection'
          $runtimeCategory = 'detection_failed'
          try {
            $runtimeVersion = Get-WebViewRuntimeVersion
            $runtimeState = 'present'
            if (-not $runtimeVersion) {
              $runtimeStage = 'runtime_download'
              $runtimeCategory = 'download_failed'
              $runtimeInstaller = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
              Invoke-WebRequest -Uri 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $runtimeInstaller -TimeoutSec 120
              $runtimeStage = 'runtime_signature'
              $runtimeCategory = 'signature_invalid'
              $runtimeSignature = Get-AuthenticodeSignature -LiteralPath $runtimeInstaller
              if ($runtimeSignature.Status -ne 'Valid' -or -not $runtimeSignature.SignerCertificate -or
                  $runtimeSignature.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false) -ne 'Microsoft Corporation') {
                throw 'signature_invalid'
              }
              $runtimeStage = 'runtime_install'
              $runtimeCategory = 'install_failed'
              $runtimeSetup = Start-Process -FilePath $runtimeInstaller -ArgumentList '/silent', '/install' -WindowStyle Hidden -PassThru
              try {
                if (-not $runtimeSetup.WaitForExit(300000)) {
                  $runtimeCategory = 'install_timeout'
                  $runtimeSetup.Kill()
                  throw 'install_timeout'
                }
                if ($runtimeSetup.ExitCode -ne 0) { throw 'install_failed' }
              } finally {
                $runtimeSetup.Dispose()
              }
              $runtimeStage = 'runtime_verification'
              $runtimeCategory = 'runtime_missing'
              $runtimeVersion = Get-WebViewRuntimeVersion
              if (-not $runtimeVersion) { throw 'runtime_missing' }
              $runtimeState = 'installed'
            }
            Write-Host "WebView2 runtime: state=$runtimeState version=$runtimeVersion"
          } catch {
            # No raw exception, installer output, paths or machine identity enters CI logs.
            Write-Host "WebView2 prerequisite failed: stage=$runtimeStage category=$runtimeCategory"
            exit 1
          }
      - name: Verify hidden WebView readiness, passive IPC and close cleanup
        run: python scripts/check_native_ui.py --cycles 20 --executable desktop/target/release/lootweave-desktop.exe
