name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Test domains, API contracts, storage and process lifecycle
        run: python -m unittest discover -s tests -v
      - name: Check architecture and publication boundaries
        run: |
          python scripts/check_architecture.py
          python scripts/check_public_docs.py
          python scripts/validate_ocr_holdout.py
          python scripts/validate_ocr_holdout.py --version v7
          python -m compileall -q contracts.py maintenance.py storage.py transport.py process_lifecycle.py service.py gateway.py runtime.py runtime_control.py services scripts
      - name: Install the pinned frontend toolchain
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Build the frontend
        run: pnpm --dir frontend build
      - name: Check runtime readiness, shared activation and visibility polling
        run: node scripts/check_frontend_runtime.mjs
      - name: Check real equipment entry and saved-profile flows without a browser
        run: pnpm --dir frontend check:core
      - name: Check acquisition rendering and sample inputs without a browser
        run: pnpm --dir frontend check:acquisition
      - name: Check snapshot confirmation rendering and handlers without a browser
        run: pnpm --dir frontend check:confirmation
      - name: Check captured-observation persistence without a browser or desktop input
        run: pnpm --dir frontend check:capture
      - name: Verify three-state and historical evaluation rendering
        run: node scripts/check_evaluation_render.mjs
      - name: Install the pinned browser runtime
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Verify keyboard, confirmation, replay and responsive flows
        run: pnpm --dir frontend check:ui

  windows-package:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '1'
      RUSTUP_TOOLCHAIN: '1.94.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13.16'
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Install pinned build dependencies
        run: |
          rustup toolchain install 1.94.1 --profile minimal
          python -m pip install -r requirements-build.txt
          npm install --global pnpm@11.19.0 --ignore-scripts
          pnpm --dir frontend install --frozen-lockfile --ignore-scripts
      - name: Build the frontend
        run: pnpm --dir frontend build
      - name: Build the frozen runtime, native host and offline NSIS installer
        run: python scripts/build_desktop.py --installer
      - name: Test native integrity and loopback contracts
        run: python scripts/build_desktop.py --test-native
      - name: Verify preparation quotes, resource budgets and persistent frozen replay
        run: python scripts/check_preparation_desktop.py --executable desktop/target/release/lootweave-desktop.exe --resources dist/sidecar --report .local/preparation-desktop/report.json
      - name: Verify twenty starts, each worker fault and forced host exit
        run: python scripts/check_desktop.py --cycles 20 --executable desktop/target/release/lootweave-desktop.exe
      - name: Verify experimental on-demand starts, faults and forced host exit
        run: python scripts/check_desktop.py --cycles 20 --startup-policy on-demand --executable desktop/target/release/lootweave-desktop.exe
      - name: Ensure the WebView2 runtime for passive native checks
        shell: pwsh
        run: |
          # Microsoft runtime detection: https://learn.microsoft.com/en-us/microsoft-edge/webview2/concepts/distribution
          $webviewRuntimeKeys = @(
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}',
            'HKCU:\Software\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          )
          function Read-WebViewRuntimeVersion {
            foreach ($webviewRuntimeKey in $webviewRuntimeKeys) {
              $webviewRuntimeValue = Get-ItemPropertyValue -LiteralPath $webviewRuntimeKey -Name pv -ErrorAction SilentlyContinue
              $webviewParsedVersion = $null
              if ([version]::TryParse([string]$webviewRuntimeValue, [ref]$webviewParsedVersion) -and $webviewParsedVersion -gt [version]'0.0.0.0') {
                return $webviewParsedVersion
              }
            }
            return $null
          }
          $webviewRuntimeVersion = Read-WebViewRuntimeVersion
          if ($null -eq $webviewRuntimeVersion) {
            $webviewOfflinePackages = @(Get-ChildItem -LiteralPath 'desktop/target/.tauri/x64' -Recurse -File -Filter 'MicrosoftEdgeWebView2RuntimeInstallerX64.exe')
            if ($webviewOfflinePackages.Count -ne 1) { throw 'offline_webview_runtime_not_unique' }
            $webviewInstallerProcess = Start-Process -FilePath $webviewOfflinePackages[0].FullName -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($webviewInstallerProcess.ExitCode -ne 0) { throw ('webview_runtime_install_failed: ' + $webviewInstallerProcess.ExitCode) }
            $webviewRuntimeVersion = Read-WebViewRuntimeVersion
            if ($null -eq $webviewRuntimeVersion) { throw 'webview_runtime_unavailable_after_install' }
          }
          Write-Output ('WebView2 runtime version: ' + $webviewRuntimeVersion)
      - name: Verify hidden WebView readiness, passive IPC and close cleanup
        run: |
          python scripts/check_native_ui.py --cycles 20 --executable desktop/target/release/lootweave-desktop.exe
          $nativeCheckExit = $LASTEXITCODE
          Write-Host "Native WebView checker exit code: $nativeCheckExit"
          exit $nativeCheckExit

      - name: Build and verify the portable ZIP with the pinned Fixed Version runtime
        shell: pwsh
        run: |
          $webviewPin = Get-Content -LiteralPath scripts/webview-runtime.json -Raw | ConvertFrom-Json
          $portableWork = Join-Path (Get-Location).Path '.local/portable-ci'
          New-Item -ItemType Directory -Path $portableWork -ErrorAction Stop | Out-Null
          $webviewCab = Join-Path $portableWork 'webview2-fixed.cab'
          Invoke-WebRequest -Uri $webviewPin.url -OutFile $webviewCab
          if ((Get-FileHash -LiteralPath $webviewCab -Algorithm SHA256).Hash.ToLowerInvariant() -ne $webviewPin.sha256) {
            throw 'fixed_webview_download_hash_mismatch'
          }
          $expandedRuntime = Join-Path $portableWork 'expanded'
          New-Item -ItemType Directory -Path $expandedRuntime -ErrorAction Stop | Out-Null
          & "$env:SystemRoot/System32/expand.exe" $webviewCab '-F:*' $expandedRuntime | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'fixed_webview_expand_failed' }
          $runtimeFolder = Join-Path $expandedRuntime ('Microsoft.WebView2.FixedVersionRuntime.' + $webviewPin.version + '.x64')
          $runtimeSignature = Get-AuthenticodeSignature -LiteralPath (Join-Path $runtimeFolder 'msedgewebview2.exe')
          if ($runtimeSignature.Status -ne 'Valid' -or $runtimeSignature.SignerCertificate.Subject -notmatch 'O=Microsoft Corporation') {
            throw 'fixed_webview_signature_invalid'
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudioPath = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $crtVersions = Get-ChildItem -LiteralPath (Join-Path $visualStudioPath 'VC/Redist/MSVC') -Directory | Where-Object Name -Match '^\d+\.\d+\.\d+$' | Sort-Object { [version]$_.Name } -Descending
          $vcRuntime = $null
          foreach ($crtVersion in $crtVersions) {
            $crtFolders = @(Get-ChildItem -LiteralPath (Join-Path $crtVersion.FullName 'x64') -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue)
            if ($crtFolders.Count -eq 1 -and (Test-Path -LiteralPath (Join-Path $crtFolders[0].FullName 'vcruntime140_1.dll'))) {
              $vcRuntime = $crtFolders[0].FullName
              break
            }
          }
          if (-not $vcRuntime) { throw 'visual_studio_redistributable_crt_missing' }
          foreach ($crtName in @('vcruntime140.dll', 'vcruntime140_1.dll')) {
            if ((Get-AuthenticodeSignature -LiteralPath (Join-Path $vcRuntime $crtName)).Status -ne 'Valid') { throw 'vc_runtime_signature_invalid' }
          }
          $portableSourceCommit = git rev-parse HEAD
          python scripts/build_portable.py --executable desktop/target/release/lootweave-desktop.exe --webview-runtime $runtimeFolder --vc-runtime-dir $vcRuntime --output dist/LootWeave-portable-windows-x64.zip --source-commit $portableSourceCommit
          if ($LASTEXITCODE -ne 0) { throw 'portable_package_failed' }
          python scripts/check_portable_desktop.py --archive dist/LootWeave-portable-windows-x64.zip --report .local/portable-ci/report.json
          if ($LASTEXITCODE -ne 0) { throw 'portable_headless_check_failed' }
          $portableGui = Join-Path $portableWork 'passive-ui'
          Expand-Archive -LiteralPath dist/LootWeave-portable-windows-x64.zip -DestinationPath $portableGui
          python scripts/check_native_ui.py --cycles 2 --executable (Join-Path $portableGui 'LootWeave.exe') --resources (Join-Path $portableGui 'sidecar')
          $portableNativeExit = $LASTEXITCODE
          Write-Host "Portable passive WebView checker exit code: $portableNativeExit"
          exit $portableNativeExit
